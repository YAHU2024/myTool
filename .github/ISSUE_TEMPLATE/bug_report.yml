name: 问题反馈
description: 报告 QuickTranslate 的可复现问题
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。此仓库公开可见，提交后任何人都可能看到内容。
        请不要填写 API Key、账号、姓名、翻译原文、公司资料、完整日志、设置文件或敏感截图。
  - type: dropdown
    id: category
    attributes:
      label: 问题类别
      options:
        - 翻译
        - 查词
        - 快捷键/取词
        - 界面显示
        - 更新
        - 其他
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: 发生了什么
      description: 请描述实际结果，不要粘贴敏感文本或完整日志。
      placeholder: 例如：点击托盘中的反馈入口后，窗口没有打开。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 如何复现
      description: 请按步骤描述触发问题的操作。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 应用与系统信息
      description: 仅粘贴应用内预览的公开摘要；不要上传日志或设置文件。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容确认
      options:
        - label: 我确认这份反馈会公开显示，且不包含密钥、账号、个人信息或敏感文本。
          required: true
