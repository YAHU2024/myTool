name: 功能建议
description: 提出一个新功能或改进点子
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个建议是为了解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望怎么实现？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充说明（可选）
      description: 截图、参考链接、使用场景等
