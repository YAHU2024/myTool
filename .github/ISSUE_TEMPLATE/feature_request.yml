name: 功能建议
description: 提议一个能改善 QuickTranslate 使用体验的功能
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        此仓库公开可见，提交后任何人都可能看到内容。请不要填写密钥、账号、个人信息或公司资料。
  - type: dropdown
    id: category
    attributes:
      label: 建议类别
      options:
        - 翻译体验
        - 查词体验
        - 快捷键/取词
        - 界面显示
        - 更新
        - 其他
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为或界面
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容确认
      options:
        - label: 我确认这份建议会公开显示，且不包含密钥、账号、个人信息或敏感文本。
          required: true
