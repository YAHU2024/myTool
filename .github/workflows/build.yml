name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore QuickTranslate/QuickTranslate.csproj

      - name: Build
        run: dotnet build QuickTranslate/QuickTranslate.csproj --no-restore -c Release

      - name: Test
        run: dotnet test QuickTranslate.Tests/QuickTranslate.Tests.csproj --no-restore -c Release
