name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.8.2, without "v" prefix)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── CI: build + test on every push/PR (skipped for manual release) ─
  build-and-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Test
        uses: ./.github/actions/build-and-test
        with:
          project_path: QuickTranslate/QuickTranslate.csproj
          test_project_path: QuickTranslate.Tests/QuickTranslate.Tests.csproj

      - name: Test Report
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: '**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      - name: Generate Coverage Report
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        continue-on-error: true
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: coveragereport
          reporttypes: 'MarkdownSummaryGithub'

      - name: Post Coverage Summary
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          header: coverage
          path: coveragereport/SummaryGithub.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx
            **/coverage.cobertura.xml
          retention-days: 7

  # ── Release build with Authenticode signing ──────────────────────
  # Triggered manually (workflow_dispatch) to produce signed installers.
  # Code signing certificate is stored as a GitHub Actions secret and
  # must be a base64-encoded PFX file. The password is stored separately
  # as CODESIGN_PASSWORD.
  #
  # Security: the private key is NEVER logged or stored in build artifacts.
  # Signtool output is captured and checked but not printed verbatim.
  release-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+(-[\w.]+)?$') {
            Write-Error "Invalid version '${{ inputs.version }}'. Expected semver format (e.g. 1.8.2 or 1.8.2-beta.1)."
            exit 1
          }
          Write-Host "Version validated: ${{ inputs.version }}"

      - name: Build & Test
        uses: ./.github/actions/build-and-test
        with:
          project_path: QuickTranslate/QuickTranslate.csproj
          test_project_path: QuickTranslate.Tests/QuickTranslate.Tests.csproj

      - name: Publish (framework-dependent, slim)
        run: dotnet publish QuickTranslate/QuickTranslate.csproj -c Release --no-restore -o publish/source/v${{ inputs.version }}

      - name: Publish (self-contained, full)
        run: dotnet publish QuickTranslate/QuickTranslate.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/source/v${{ inputs.version }}-full

      - name: Validate publish outputs
        shell: pwsh
        run: |
          $slimExe = "publish/source/v${{ inputs.version }}/QuickTranslate.exe"
          $fullExe = "publish/source/v${{ inputs.version }}-full/QuickTranslate.exe"
          $ok = $true
          if (-not (Test-Path $slimExe)) {
            Write-Error "Missing: $slimExe — framework-dependent publish may have failed"
            $ok = $false
          }
          if (-not (Test-Path $fullExe)) {
            Write-Error "Missing: $fullExe — self-contained publish may have failed"
            $ok = $false
          }
          if (-not $ok) { exit 1 }
          Write-Host "Publish outputs verified."

      - name: Setup Inno Setup
        uses: 473c8e/setup-innosetup@v1
        with:
          version: '6.2.0'

      - name: Build installers
        shell: pwsh
        run: |
          New-Item "publish/releases/v${{ inputs.version }}" -ItemType Directory -Force
          ISCC /DMyAppVersion=${{ inputs.version }} installer/QuickTranslate-setup.iss
          ISCC /DMyAppVersion=${{ inputs.version }} installer/QuickTranslate-setup-full.iss

      - name: Sign installers (Authenticode)
        if: env.CODESIGN_CERTIFICATE != ''
        env:
          CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"

          # Decode and write PFX to temporary file (never logged)
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_CERTIFICATE))

          $tsUrl = "http://timestamp.digicert.com"
          $installers = @(
            "publish/releases/v${{ inputs.version }}/QuickTranslate-Setup-${{ inputs.version }}-win-x64.exe",
            "publish/releases/v${{ inputs.version }}/QuickTranslate-Setup-${{ inputs.version }}-win-x64-full.exe"
          )

          try {
            foreach ($installer in $installers) {
              if (Test-Path $installer) {
                & signtool sign /fd SHA256 /tr $tsUrl /td SHA256 `
                  /f $pfxPath /p $env:CODESIGN_PASSWORD `
                  /d "QuickTranslate Setup" $installer
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Signing failed for $installer"
                  exit 1
                }
              }
            }
          }
          finally {
            # Clean up PFX even if signing fails
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signatures
        if: env.CODESIGN_CERTIFICATE != ''
        shell: pwsh
        run: |
          $installers = @(
            "publish/releases/v${{ inputs.version }}/QuickTranslate-Setup-${{ inputs.version }}-win-x64.exe",
            "publish/releases/v${{ inputs.version }}/QuickTranslate-Setup-${{ inputs.version }}-win-x64-full.exe"
          )
          foreach ($installer in $installers) {
            if (Test-Path $installer) {
              $result = & signtool verify /pa /v $installer 2>&1
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Signature verification failed for $installer"
                exit 1
              }
              Write-Host "Signature verified: $installer"
            }
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-v${{ inputs.version }}
          path: publish/releases/v${{ inputs.version }}/*.exe
          retention-days: 7

      - name: Upload version.xml
        uses: actions/upload-artifact@v4
        with:
          name: version-xml-v${{ inputs.version }}
          path: installer/version.xml
          retention-days: 7
