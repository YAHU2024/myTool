name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 仅允许一个部署任务，新任务会取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync site assets (docs/images -> site/assets/img)
        run: python3 scripts/sync-site-assets.py --sync

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点根目录（含 index.html 与 assets/）
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
